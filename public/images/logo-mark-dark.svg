<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="title desc">
  <title id="title">无限任务画布</title>
  <desc id="desc">开放式取景框中的橙色任务卡，虚线牵引光标冲出边界</desc>

  <!-- 开放式取景框：四角留白，寓意画布没有边界 -->
  <g fill="none" stroke="#F2F0E9" stroke-width="13" stroke-linecap="round">
    <path d="M22 84 L22 48 Q22 22 48 22 L84 22" />
    <path d="M156 22 L192 22 Q218 22 218 48 L218 84" />
    <path d="M22 156 L22 192 Q22 218 48 218 L84 218" />
    <path d="M156 218 L192 218 Q218 218 218 192 L218 156" />
  </g>

  <!-- 任务卡：与画布缩略图同源的「文本占位条」 -->
  <rect x="72" y="86" width="96" height="68" rx="18" fill="#FF6A26" />
  <rect x="88" y="105" width="44" height="8" rx="4" fill="#1D1C18" />
  <rect x="88" y="121" width="26" height="8" rx="4" fill="#1D1C18" opacity="0.75" />

  <!-- 越界的想法：虚线冲出右侧缺口，落在框外 -->
  <path d="M168 120 H220" fill="none" stroke="#FF6A26" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12" opacity="0.75" />
  <circle cx="228" cy="120" r="7" fill="#FF6A26" />
</svg>
